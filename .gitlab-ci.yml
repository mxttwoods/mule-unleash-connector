# Builds and tests the connector, runs the examples on Mule CE, and publishes the connector to
# your organization's Anypoint Exchange through scripts/publish-to-exchange.sh.
#
# Publishing runs automatically for a tag that matches the pom version (v1.0.1 for 1.0.1) and is
# available as a manual job on the default branch. Exchange rejects a version that already
# exists, so bump <version> in pom.xml before each publish.
#
# Settings > CI/CD > Variables:
#   ANYPOINT_ORG_ID         Business group ID (a UUID). Access Management > Business Groups.
#   ANYPOINT_CLIENT_ID      Connected app client ID with the Exchange Contributor scope.
#   ANYPOINT_CLIENT_SECRET  Connected app secret. Mark it masked and protected.
#   ANYPOINT_REGION         Optional: us (default), eu or gov.
#   MAVEN_SETTINGS_XML      Optional File variable: a settings.xml with your Maven mirror or proxy.

stages: [build, examples, publish]

variables:
  MAVEN_USER_HOME: "$CI_PROJECT_DIR/.m2"
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"

default:
  image: eclipse-temurin:17-jdk
  cache:
    key: maven
    paths: [.m2/]
  before_script:
    - mkdir -p "$HOME/.m2"
    - if [ -n "${MAVEN_SETTINGS_XML:-}" ]; then cp "$MAVEN_SETTINGS_XML" "$HOME/.m2/settings.xml"; fi

build:
  stage: build
  parallel:
    matrix:
      - JDK: ["17", "21"]
  image: eclipse-temurin:${JDK}-jdk
  script:
    - ./mvnw -B clean verify
  artifacts:
    when: always
    paths:
      - target/*-mule-plugin.jar
    reports:
      junit:
        - target/surefire-reports/TEST-*.xml
        - target/failsafe-reports/TEST-*.xml

examples:
  stage: examples
  needs: []
  cache:
    - key: maven
      paths: [.m2/]
    - key: mule-ce-4.9.0
      paths: [.cache/]
  variables:
    XDG_CACHE_HOME: "$CI_PROJECT_DIR/.cache"
  script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends python3 curl >/dev/null
    - examples/run-local.sh

publish-exchange:
  stage: publish
  needs: [build, examples]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d/
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
  script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git >/dev/null
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - version="$(./mvnw -B -q help:evaluate -Dexpression=project.version -DforceStdout)"
    - |
      if [ -n "${CI_COMMIT_TAG:-}" ] && [ "$CI_COMMIT_TAG" != "v$version" ]; then
        echo "Tag $CI_COMMIT_TAG does not match pom version $version" >&2
        exit 1
      fi
    - scripts/publish-to-exchange.sh --org-id "$ANYPOINT_ORG_ID" --region "${ANYPOINT_REGION:-us}"
