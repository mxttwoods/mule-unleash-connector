name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - run: ./mvnw -v
      - run: ./mvnw -B clean verify
      - uses: actions/upload-artifact@v7
        if: matrix.java == '17'
        with:
          name: mule-plugin
          path: target/*-mule-plugin.jar

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/cache@v4
        with:
          path: ~/.cache/mule-unleash-examples
          key: mule-ce-4.9.0
      - run: examples/run-local.sh
