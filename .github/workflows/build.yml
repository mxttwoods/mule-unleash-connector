name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - run: ./mvnw -v
      - run: ./mvnw -B clean package
      - uses: actions/upload-artifact@v4
        if: matrix.java == '17'
        with:
          name: mule-plugin
          path: target/*-mule-plugin.jar
