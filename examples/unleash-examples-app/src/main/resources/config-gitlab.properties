# Values from Deploy > Feature flags > Configure in your GitLab project.
# Pass the Instance ID at deploy time: -M-Dunleash.instance.id=<instance-id>
unleash.api.url=https://gitlab.example.com/api/v4/feature_flags/unleash/42
unleash.app.name=production
unleash.api.key=
unleash.environment=production
unleash.fetch.interval=60
unleash.test.connectivity=true
# Empty uses a file in the JVM temp dir. Last-known flags are read from it at boot.
unleash.backup.file=
http.port=8081
