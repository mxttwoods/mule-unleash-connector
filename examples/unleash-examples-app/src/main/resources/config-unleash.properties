# Unleash OSS or Enterprise. Pass the client token at deploy time: -M-Dunleash.api.key=<token>
unleash.api.url=https://unleash.example.com/api
unleash.instance.id=unleash-examples-app
unleash.app.name=unleash-examples-app
unleash.environment=production
unleash.fetch.interval=15
unleash.test.connectivity=true
# Empty uses a file in the JVM temp dir. Last-known flags are read from it at boot.
unleash.backup.file=
http.port=8081
